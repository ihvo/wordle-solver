[project]
name = "wordle-guesser"
version = "0.1.0"
description = "Wordle solver: an entropy-maximizing teacher and a behavior-cloned PyTorch transformer policy."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.scripts]
wordle-guesser = "wordle_guesser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wordle_guesser"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
